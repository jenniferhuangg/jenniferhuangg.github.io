    body.exp-page .stacked-gallery {
      display: flex;
      flex-direction: column;

      gap: 24px;

      max-width: min(900px, 92vw);

      margin: 96px auto 72px;

      padding: 0 8px;
    }

    .exp-card {
      display: block;

      width: 100%;

      padding: 0;

      border: none;
      outline: none;

      background: transparent;

      cursor: pointer;

      perspective: 1500px;

      font-family: inherit;
    }

    .exp-card-inner {
      display: grid;

      width: 100%;

      transform-style: preserve-3d;

      transition: transform 0.65s ease;
    }

    .exp-card.flipped .exp-card-inner {
      transform: rotateY(180deg);
    }

    .exp-card-front,
    .exp-card-back {
      grid-area: 1 / 1;

      width: 100%;
      height: auto;

      display: block;

      object-fit: contain;

      border-radius: 12px;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .exp-card-front {
      transform: rotateY(0deg);
    }

    .exp-card-back {
      transform: rotateY(180deg);
    }

    .exp-card:hover {
      filter: brightness(1.03);
    }

    .exp-card.flipped .exp-card-inner {
      transform: rotateY(180deg);
    }

    .exp-card:focus-visible {
      outline: 2px solid #fff7cf;

      outline-offset: 5px;

      border-radius: 12px;
    }


    body.exp-page .dropdown {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      transform: translateY(-100%);

      max-height: 100dvh;

      overflow-y: auto;

      z-index: 1000;
    }

    @media (max-width: 700px) {

      body.exp-page .stacked-gallery {
        width: 92%;

        margin-top: 70px;
      }

    }

  </style>

</head>

  <script>

    function hamburg() {

      document
        .querySelector(".dropdown")
        .style
        .transform = "translateY(0)";

    }


    function cancel() {

      document
        .querySelector(".dropdown")
        .style
        .transform = "translateY(-100%)";

    }

    const experienceCards = document.querySelectorAll(".exp-card");
    experienceCards.forEach((card) => {
      card.addEventListener("click", () => {
        card.classList.toggle("flipped");
        const isFlipped = card.classList.contains("flipped");
        card.setAttribute(
          "aria-pressed",
          isFlipped.toString()
        );

      });

    });

  </script>

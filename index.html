<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jennifer Huang's Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >
</head>


<body class="home-page">

    <!-- NAVIGATION -->
    <nav>

        <div class="nav-container">

            <div class="logo">

                <span>
                    Jennifer Huang

                    <span class="bow">
                        ⋆.𐙚 ̊
                    </span>
                </span>

            </div>


            <!-- Desktop nav -->
            <div class="links">

                <div class="link">
                    <a href="index.html">
                        home
                    </a>
                </div>

                <div class="link">
                    <a href="about.html">
                        about
                    </a>
                </div>

                <div class="link">
                    <a href="projects.html">
                        projects
                    </a>
                </div>

                <div class="link">
                    <a href="exp.html">
                        experiences
                    </a>
                </div>

            </div>


            <!-- Mobile hamburger -->
            <i
                class="fa-solid fa-bars hamburg"
                onclick="hamburg()"
            ></i>

        </div>


        <!-- Mobile dropdown -->
        <div class="dropdown">

            <div class="links">

                <a href="index.html">
                    home
                </a>

                <a href="about.html">
                    about
                </a>

                <a href="projects.html">
                    projects
                </a>

                <a href="exp.html">
                    experiences
                </a>

                <i
                    class="fa-solid fa-xmark cancel"
                    onclick="cancel()"
                ></i>

            </div>

        </div>

    </nav>


    <!-- HOME -->
    <section class="home-section">

        <div class="main-container">

            <!-- PHOTO -->
            <div class="image">

                <img
                    src="Subject.png"
                    alt="Jennifer Huang"
                >

            </div>


            <!-- TEXT -->
            <div class="content">

                <h1>
                    Welcome!

                    <span class="stars">
                        . ݁₊ ⊹ . ݁ ⟡ ݁
                    </span>
                </h1>


                <h1 class="home-name">
                    I'm Jennifer
                </h1>


                <div class="typewriter home-typewriter">
                    <span></span>
                </div>


                <!-- SOCIALS -->
                <div class="social-links">

                    <a
                        href="https://www.linkedin.com/in/jennifer-huang-b68ab4317"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="LinkedIn"
                    >

                        <i class="fa-brands fa-linkedin"></i>

                    </a>


                    <a
                        href="https://github.com/jenniferhuangg"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="GitHub"
                    >

                        <i class="fa-brands fa-github"></i>

                    </a>

                </div>

            </div>

        </div>

    </section>


    <script>

        function hamburg() {

            document
                .querySelector(".dropdown")
                .style
                .transform = "translateY(0)";

        }


        function cancel() {

            document
                .querySelector(".dropdown")
                .style
                .transform = "translateY(-100%)";

        }

    </script>

</body>

</html>
